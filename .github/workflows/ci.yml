name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  mobile:
    name: Mobile app (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  edge-functions:
    name: Edge Function ${{ matrix.function }} (deno check)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [identify-rock, delete-account, generate-summaries]
    defaults:
      run:
        working-directory: services/supabase/functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check index.ts
